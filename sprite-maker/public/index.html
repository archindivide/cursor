<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sprite Creator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Sprite Creator</h1>
    <p class="subtitle">32×32 · 64×64 · 128×128 · 256 colors</p>
  </header>

  <main>
    <section class="toolbar">
      <div class="size-select" id="sizeSelect"></div>
      <div class="tools" id="toolsEl"></div>
      <div class="actions">
        <button type="button" id="exportBtn">Export JSON</button>
        <label for="importFile" class="import-label">Import JSON</label>
        <input type="file" id="importFile" accept=".json,application/json" class="import-file-input">
      </div>
    </section>

    <section class="editor">
      <div class="canvas-wrap">
        <canvas id="canvas"></canvas>
      </div>
      <div class="palette-wrap">
        <div class="palette" id="paletteEl"></div>
      </div>
    </section>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
